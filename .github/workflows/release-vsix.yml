name: Release VSIX and Marketplace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-vsix-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Determine whether this version is new
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          vsix="ai-usage-statusbar-gustavohrg-2026-${version}.vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version ${version} already has tag ${tag}; skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} is new; release will proceed."
          fi

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci

      - name: Audit dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm audit --audit-level=high

      - name: Test
        if: steps.release.outputs.should_release == 'true'
        run: npm test

      - name: Package VSIX
        if: steps.release.outputs.should_release == 'true'
        run: npm run package:vsix

      - name: Publish to VS Code Marketplace
        if: steps.release.outputs.should_release == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VSCE_PAT:?VSCE_PAT is required for Marketplace publishing}"
          npx @vscode/vsce publish \
            --pat "$VSCE_PAT" \
            --packagePath "ai-usage-statusbar-gustavohrg-2026-${VERSION}.vsix"

      - name: Upload VSIX artifact
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.vsix }}
          if-no-files-found: error

      - name: Create and push release tag
        if: steps.release.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: v${{ steps.release.outputs.version }}
          files: ${{ steps.release.outputs.vsix }}
          generate_release_notes: true
