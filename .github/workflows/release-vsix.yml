name: Release VSIX and Marketplace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-vsix-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "vsix=ai-usage-statusbar-gustavohrg-2026-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npm run package:vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VSCE_PAT:?VSCE_PAT is required for Marketplace publishing}"
          npx @vscode/vsce publish \
            --pat "$VSCE_PAT" \
            --packagePath "ai-usage-statusbar-gustavohrg-2026-${VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ steps.bump.outputs.version }}
          path: ${{ steps.bump.outputs.vsix }}
          if-no-files-found: error

      - name: Commit release bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"

      - name: Create and push release tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: v${{ steps.bump.outputs.version }}
          files: ${{ steps.bump.outputs.vsix }}
          generate_release_notes: true
